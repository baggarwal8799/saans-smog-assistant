# Security updates only: Dependabot opens a pull request when a dependency has a known vulnerability
# (GitHub's security updates), never routine version bumps, so main is never flooded with failing upgrade PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
